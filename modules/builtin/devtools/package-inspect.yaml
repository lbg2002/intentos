id: package.inspect
version: 1
summary: 检查软件包安装来源（dpkg/APT/Snap/Flatpak）、当前版本、候选版本与破损依赖详情
category: devtools
aliases: ["软件包安装详情", "安装包来源检查", "依赖破损诊断", "package inspect"]
l0_patterns:
  - "检查软件包 {package} 安装详情"
  - "查看包 {package} 安装来源"
input_schema:
  type: object
  required: [package]
  properties:
    package:
      type: string
      maxLength: 256
      description: 软件包名称或 Flatpak 应用 ID（如 curl、libreoffice、org.gimp.GIMP）
effects: [observe]
idempotent: true
execution:
  type: builtin
  handler: package.inspect
undo: none
verification:
  kind: structured_output
feedback: "已完成多源软件包状态与依赖核查"
