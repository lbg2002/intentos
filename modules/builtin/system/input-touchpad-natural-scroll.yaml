id: input.touchpad.natural_scroll
version: 1
summary: 开启或关闭触控板自然滚动方向（natural-scroll，可撤销）
category: system
aliases: ["自然滚动", "触控板反向滚动", "natural scroll"]
l0_patterns:
  - "(开启|打开|关闭|关掉)(触控板)?自然滚动"
input_schema:
  type: object
  required: [state]
  properties:
    state:
      type: string
      enum: ["on", "off", "toggle"]
effects: [setting]
idempotent: false
execution:
  type: setting_backend
  driver: touchpad_natural_scroll
  schema: org.gnome.desktop.peripherals.touchpad
  key: natural-scroll
setting:
  key_id: input.touchpad.natural_scroll
  enum_values: ["on", "off", "toggle"]
undo: restore_previous_value
verification:
  kind: readback
