id: input.mouse.speed
version: 1
summary: 设置或相对调整鼠标指针速度（-1.0 至 1.0，步长 0.2，读回验证并可撤销）
category: system
aliases: ["鼠标速度", "鼠标快一点", "鼠标慢一点", "mouse speed"]
l0_patterns:
  - "鼠标(速度)?(快一点|慢一点)"
  - "鼠标速度(调到|设为)? {value}"
input_schema:
  type: object
  properties:
    value:
      type: number
    relative:
      type: string
      enum: [up, down]
  oneOf:
    - required: [value]
    - required: [relative]
effects: [setting]
idempotent: false
execution:
  type: setting_backend
  driver: mouse_speed
  schema: org.gnome.desktop.peripherals.mouse
  key: speed
setting:
  key_id: input.mouse.speed
  min: -1.0
  max: 1.0
  step: 0.2
undo: restore_previous_value
verification:
  kind: readback
