id: sound.mic.volume.set
version: 1
summary: 设置或相对调整麦克风输入音量（0–100%，步长 10%，读回验证并可撤销）
category: system
aliases: ["麦克风音量", "话筒音量", "mic volume"]
l0_patterns:
  - "麦克风音量(调到|设为)? {value}%?"
  - "麦克风(声音)?(大|小)一点"
input_schema:
  type: object
  properties:
    value:
      type: number
    relative:
      type: string
      enum: [up, down]
  oneOf:
    - required: [value]
    - required: [relative]
effects: [setting]
idempotent: false
execution:
  type: setting_backend
  driver: wpctl_mic_volume
setting:
  key_id: sound.mic.volume
  min: 0
  max: 100
  step: 10
  unit: "%"
undo: restore_previous_value
verification:
  kind: readback
