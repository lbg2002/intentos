[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/fsops",
    "crates/sandbox",
    "crates/capability-sdk",
    "crates/intentosd",
    "crates/intentosctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["IntentOS Contributors"]
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
rusqlite = { version = "0.32", features = ["backup"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
regex = "1.11"
pinyin = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
axum = { version = "0.8", features = ["ws", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls", "http2"] }
futures-util = "0.3"
tokio-stream = "0.1"
urlencoding = "2.1"
walkdir = "2.5"
tempfile = "3.14"

intentos-protocol = { path = "crates/protocol" }
intentos-fsops = { path = "crates/fsops" }
intentos-sandbox = { path = "crates/sandbox" }
intentos-capability-sdk = { path = "crates/capability-sdk" }
intentosd = { path = "crates/intentosd" }
