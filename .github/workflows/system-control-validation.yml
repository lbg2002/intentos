name: system-control-validation
on:
  push:
    branches: [main, "sc/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  l1:
    name: L1 - static and pure logic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev pkg-config
      - run: bash scripts/probe-validation-env.sh --l1
      - run: bash -n scripts/*.sh packaging/deb/build-deb.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test -p intentos-protocol -p intentos-capability-sdk --locked -- --test-threads=1
      - run: cargo test -p intentosd --lib command_line_ --locked -- --test-threads=1
      - name: SC-05 action compatibility contract
        run: cargo test -p intentosd --lib sc05_ --locked -- --test-threads=1
      - name: SC-07 settings optimistic undo conflict
        run: cargo test -p intentosd --lib sc07_ --locked -- --test-threads=1
      - name: SC-08 non-executable draft syntax checks
        run: cargo test -p intentosd --lib sc08_ --locked -- --test-threads=1
      - name: SC-03 fail-closed script gate
        run: cargo test -p intentosd --lib sc03_unfrozen --locked -- --test-threads=1
      - name: SC-09 policy session grant regression
        run: cargo test -p intentosd --lib home_directory_session_grant_covers_search_and_dot_children_while_blocking_ssh --locked -- --test-threads=1
      - name: SC-09 JavaScript syntax (no desktop execution)
        shell: bash
        run: |
          node --input-type=module --check < crates/intentosd/src/web_ui/assets/js/result-surfaces.js
          node --input-type=module --check < crates/intentosd/src/web_ui/assets/js/main.js
      - name: SC-06/10 read-only Python evidence and release gate fixtures
        run: python3 -m unittest discover -s scripts -p 'test_sc*.py' -v
      - name: SC-10 release must remain blocked without verified evidence
        shell: bash
        run: |
          set +e
          python3 scripts/sc10_release_gate.py > /tmp/sc10-release-gate.json
          status=$?
          set -e
          cat /tmp/sc10-release-gate.json
          test "$status" -eq 2
          python3 -c 'import json; r=json.load(open("/tmp/sc10-release-gate.json")); assert r["release_allowed"] is False; assert r["blocked_packages"] >= 1'
  l1_full:
    name: L1 - full workspace regression (not OS-isolation certification)
    needs: l1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev pkg-config
      - run: bash scripts/probe-validation-env.sh --l1
      - name: Full regression; errors remain errors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          env -u DISPLAY -u WAYLAND_DISPLAY cargo test --workspace --locked --no-fail-fast -- --test-threads=1 2>&1 | tee work/system-control-l1-full.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-control-l1-full-log
          path: work/system-control-l1-full.log

  l2:
    name: L2 - trusted actual isolation (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, intentos-ubuntu-isolation]
    environment: intentos-isolation
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/probe-validation-env.sh --l2
      - run: cargo test -p intentos-sandbox --lib --locked -- --test-threads=1
      - run: env -u DISPLAY -u WAYLAND_DISPLAY cargo test --workspace --locked --no-fail-fast -- --test-threads=1
  l3:
    name: L3 - trusted GNOME (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, intentos-ubuntu-desktop]
    environment: intentos-desktop
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/probe-validation-env.sh --l3
      - name: GUI smoke; skip is not pass
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 desktop/settings/intentos-settings.py --smoke-ui | tee settings.log
          /usr/bin/python3 desktop/gtk-fallback/intentos-launcher.py --smoke-ui | tee launcher.log
          if grep -iE '(^|[^a-z])(skip|skipped)([^a-z]|$)' settings.log launcher.log; then exit 1; fi
  l4:
    name: L4 - exclusive Release benchmark (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, intentos-perf-exclusive]
    environment: intentos-performance
    env:
      INTENTOS_PERF_EXCLUSIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/probe-validation-env.sh --l4
      - run: cargo build --release --workspace --locked
      - run: |
          mkdir -p work
          ./target/release/intentosctl eval --corpus eval/intents/v0_1_shell_300.json --report-out work/system-control-eval.md
      - uses: actions/upload-artifact@v4
        with:
          name: system-control-release-eval
          path: work/system-control-eval.md
